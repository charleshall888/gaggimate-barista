[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gaggimate-mcp-python"
version = "0.1.0"
description = "Gaggimate MCP server for espresso machine control"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.13.3",
    "mcp[cli]>=1.26.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "structlog>=25.5.0",
    "websockets>=16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gaggimate_mcp"]
